<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A surprise for Gaurav 🎂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ff9a8b,#fecfef,#ffd580)}
  .card{background:rgba(255,255,255,0.5);backdrop-filter:blur(12px);border-radius:24px;padding:48px 40px;text-align:center;max-width:400px;width:90%;border:2px solid rgba(255,255,255,0.7);box-shadow:0 20px 60px rgba(212,96,42,0.2)}
  .lock-icon{font-size:56px;display:block;margin-bottom:16px;animation:bob 2.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  h1{font-family:'Playfair Display',serif;font-size:26px;color:#6b2d1a;margin-bottom:8px}
  .sub{font-size:14px;color:#a05030;font-style:italic;margin-bottom:28px}
  input{width:100%;padding:14px 20px;border-radius:40px;border:2px solid rgba(255,255,255,0.7);background:rgba(255,255,255,0.6);font-size:15px;font-family:'DM Sans',sans-serif;color:#6b2d1a;text-align:center;outline:none;margin-bottom:14px}
  input::placeholder{color:#c08060}
  input:focus{border-color:rgba(255,255,255,0.95)}
  button{background:#d4602a;color:#fff;border:none;border-radius:40px;padding:14px 40px;font-size:15px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background 0.2s}
  button:hover{background:#b84e1f}
  .err{color:#a00;font-size:13px;margin-top:12px;min-height:18px;font-weight:500}
  #bday{display:none}
  .cake{font-size:70px;display:block;margin-bottom:16px;animation:pop 0.6s cubic-bezier(0.36,0.07,0.19,0.97)}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .to{font-size:13px;color:#a05030;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:8px;font-weight:500}
  .name{font-family:'Playfair Display',serif;font-size:38px;color:#6b1a0a;margin-bottom:18px}
  .divider{width:60px;height:3px;background:linear-gradient(90deg,#d4602a,#f0a060);border-radius:2px;margin:0 auto 22px}
  .msg{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:#7a2010;line-height:1.6;margin-bottom:24px}
  .balls{font-size:32px;letter-spacing:8px;margin-bottom:10px}
  .from{font-size:14px;color:#c08050;font-style:italic}
  .confetti-wrap{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
  .c{position:absolute;width:9px;height:9px;border-radius:2px;animation:fall linear infinite}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="card">
  <div id="lock">
    <span class="lock-icon">🎁</span>
    <h1>A surprise awaits you!</h1>
    <p class="sub">Enter the secret password to unlock ✨</p>
    <input type="password" id="pw" placeholder="Enter password…" onkeydown="if(event.key==='Enter')unlock()"/>
    <button onclick="unlock()">Unlock Surprise 🔓</button>
    <div class="err" id="err"></div>
  </div>
  <div id="bday">
    <span class="cake">🎂</span>
    <div class="to">Happy Birthday</div>
    <div class="name">Gaurav Gharia</div>
    <div class="divider"></div>
    <div class="msg">"Wish you a happy birthday"</div>
    <div class="balls">🎈🎊🎉🎈</div>
    <div class="from">with love 💛</div>
  </div>
</div>
<div class="confetti-wrap" id="cw"></div>
<script>
function unlock(){
  if(document.getElementById('pw').value==='Alwaysbehappy'){
    document.getElementById('lock').style.display='none';
    document.getElementById('bday').style.display='block';
    var cw=document.getElementById('cw');
    var cols=['#ff9a8b','#ffd580','#fecfef','#d4602a','#fff0a0'];
    for(var i=0;i<40;i++){
      var d=document.createElement('div');
      d.className='c';
      d.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*5+'%;background:'+cols[i%5]+';animation-duration:'+(1.5+Math.random()*2.5)+'s;animation-delay:'+Math.random()*1.5+'s;width:'+(7+Math.random()*9)+'px;height:'+(7+Math.random()*9)+'px;border-radius:'+(Math.random()>.5?'50%':'2px')+';';
      cw.appendChild(d);
    }
  } else {
    document.getElementById('err').textContent='✕ Wrong password — try again!';
    document.getElementById('pw').value='';
    setTimeout(function(){document.getElementById('err').textContent=''},2000);
  }
}
</script>
</body>
</html>
